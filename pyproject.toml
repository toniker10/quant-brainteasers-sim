[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-brainteasers-sim"
version = "1.0.0"
description = "Exact analytical solutions + Monte Carlo simulations for classic quant-interview probability brainteasers (coin betting / Kelly Criterion, and the 3-4-5 dice sequence)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "quant-brainteasers-sim contributors" }
]
keywords = ["quant", "probability", "monte-carlo", "kelly-criterion", "markov-chain", "finance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
